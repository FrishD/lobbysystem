<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="assets/styles.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="assets/script.js"></script>

    <title>Nexus Dev.</title>
</head>
<body>
    <div class="root">
        <div class="lobby-Main">
            <div class="lobby-gradient" id="lobby-gradient"></div>
            <button class="button" onclick="Close()">Close</button>
            <div class="wavesbilmemnesi"></div>
            <div class="btn-container">
                <label class="switch btn-color-mode-switch">
                    <input value="1" id="color_mode" name="color_mode" type="checkbox">
                    <label class="btn-color-mode-switch-inner" data-off="Light" data-on="Dark" for="color_mode"></label>
                </label>
            </div>
            <div class="usercard">
                <img class="usercard-steamphoto" src="" alt="">
                <div class="usercard-steamname"><div class="circlething" style="margin-top: 0.88vh; animation: none; opacity: 1;"><div class="circlething-inner"></div> </div><span></span></div>
            </div>

            <div id="lobby-selection">
                <div class="lobbies" id="lobby-list">
                    <!-- Dynamic lobby list appears here -->
                </div>
                <div class="create-lobby-container">
                    <input type="text" id="lobby-name-input" placeholder="Enter Lobby Name...">
                    <select id="lobby-type-select">
                        <option value="ramp">Ramp</option>
                        <option value="pvp">PVP</option>
                    </select>
                    <button id="create-lobby-btn">Create Lobby</button>
                </div>
            </div>

            <div id="lobby-dashboard" style="display: none;">
                <h2 id="dashboard-lobby-name">Lobby Name</h2>
                <div class="dashboard-columns">
                    <div class="player-list-container">
                        <h3>Players</h3>
                        <ul id="player-list">
                            <!-- Player list will be populated here -->
                        </ul>
                    </div>
                    <div class="game-options-container">
                        <h3>Game Options</h3>
                        <div id="game-options">
                            <!-- Game-specific options will appear here -->
                        </div>
                        <button id="start-game-btn">Start Game</button>
                    </div>
                </div>
                <button id="back-to-lobbies-btn">Back to Lobbies</button>
            </div>
        </div>
    </div>
</body>
</html>
