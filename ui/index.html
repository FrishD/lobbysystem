<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="assets/styles.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="assets/script.js"></script>

    <title>Nexus Dev.</title>
</head>
<body>
    <div class="root">
        <div class="lobby-Main">
            <div class="lobby-gradient" id="lobby-gradient">
            </div>
            <button class="button" onclick="Close()">Close</button>

            <div class="wavesbilmemnesi"></div>
            <div class="btn-container">
                <label class="switch btn-color-mode-switch">
                    <input value="1" id="color_mode" name="color_mode" type="checkbox">
                    <label class="btn-color-mode-switch-inner" data-off="Light" data-on="Dark" for="color_mode"></label>
                </label>
                        
            </div>
            <div class="usercard">
                <!-- <div class="usercard-steamphoto"></div> -->
                <img class="usercard-steamphoto" src="" alt="">
                <div class="usercard-steamname"><div class="circlething" style="margin-top: 0.88vh; animation: none; opacity: 1;"><div class="circlething-inner"></div> </div>Elyasinyooo</div>
            </div>

            <div class="options-container" id="options-container">
                <div class="option-card" id="zaira">
                    <h2>זאירה</h2>
                    <input type="number" class="lobby-input" placeholder="הכנס מספר לובי">
                    <div class="team-selection">
                        <label><input type="radio" name="team-zaira" value="1"> Team 1</label>
                        <label><input type="radio" name="team-zaira" value="2"> Team 2</label>
                    </div>
                    <button class="connect-button">התחבר</button>
                </div>
                <div class="option-card" id="zakim">
                    <h2>זאקים</h2>
                    <input type="number" class="lobby-input" placeholder="הכנס מספר לובי">
                    <div class="team-selection">
                        <label><input type="radio" name="team-zakim" value="1"> Team 1</label>
                        <label><input type="radio" name="team-zakim" value="2"> Team 2</label>
                    </div>
                    <button class="connect-button">התחבר</button>
                </div>
                <div class="option-card" id="rampot">
                    <h2>רמפות</h2>
                    <input type="number" class="lobby-input" placeholder="הכנס מספר לובי">
                    <div class="team-selection">
                        <!-- Hidden team selection for Rampot -->
                    </div>
                    <button class="connect-button">התחבר</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
