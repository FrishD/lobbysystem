<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="assets/styles.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <title>Nexus Lobby System</title>
</head>
<body>
    <div class="root" style="display: none;">
        <!-- Main Container -->
        <div class="main-container">
            <!-- Game Mode Selection View -->
            <div id="game-mode-selection" class="view active">
                <div class="header">
                    <h2>Select Game Mode</h2>
                </div>
                <div id="game-modes-container" class="game-modes-grid">
                    <!-- Game modes will be injected here by JavaScript -->
                </div>
            </div>

            <!-- Lobby Details View -->
            <div id="lobby-details" class="view">
                <div class="header">
                    <button id="back-button" class="back-button"><i class="fas fa-arrow-left"></i></button>
                    <h2 id="lobby-title">Lobby Details</h2>
                </div>
                <div class="lobby-form">
                    <input type="number" id="lobby-id-input" placeholder="Lobby ID">

                    <div id="team-selection" style="display: none;">
                        <label>Select Team:</label>
                        <div class="radio-group">
                            <input type="radio" id="team1" name="team" value="1" checked>
                            <label for="team1">Team 1</label>
                            <input type="radio" id="team2" name="team" value="2">
                            <label for="team2">Team 2</label>
                        </div>
                    </div>

                    <div id="weapon-selection" style="display: none;">
                        <label for="weapon-select">Select Weapon:</label>
                        <select id="weapon-select">
                            <!-- Weapons will be populated here -->
                        </select>
                    </div>

                    <button id="connect-button" class="connect-button">Connect</button>
                </div>
            </div>
             <div class="usercard">
                <img class="usercard-steamphoto" src="" alt="">
                <div class="usercard-steamname"><div class="circlething" style="margin-top: 0.88vh; animation: none; opacity: 1;"><div class="circlething-inner"></div> </div></div>
            </div>
            <button id="close-button" class="close-button">Close</button>
        </div>
    </div>
    <script src="assets/script.js"></script>
</body>
</html>
